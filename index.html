<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculateur d'IMC — Akieni Academy</title>
    <!-- Lien vers la feuille de style du projet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- En-tête du site -->
    <header class="entete">
      <h1>Calculateur d'IMC</h1>
      <p class="sous-titre">Semaine 7 — Projet débutant</p>
    </header>

    <main>
      <!-- Section où les résultats IMC seront affichés par JavaScript -->
      <section class="carte">
        <h2>Résultats</h2>
        <div id="sortie"><!-- le JavaScript écrit ici --></div>
      </section>

      <!-- Tableau récapitulatif des catégories IMC -->
      <div class="tableau">
        <table>
          <thead>
            <tr>
              <th>Maigreur</th>
              <th>Normal</th>
              <th>Surpoids</th>
              <th>Obesite</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Inferieur a 18.5</td>
              <td>18.5 — 24.9</td>
              <td>25 — 29.9</td>
              <td>30 et plus</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Pied de page simple -->
    <footer class="pied">
      <p>Akieni Academy — Cohorte 2 — 2026</p>
    </footer>

    <!-- Fichier JavaScript du projet -->
    <script src="imc.js"></script>
  </body>
</html>
